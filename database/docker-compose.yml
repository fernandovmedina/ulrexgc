services:
  postgres:
    image: postgres:16-alpine
    container_name: ulrex-db
    environment:
      POSTGRES_DB: ulrex
      POSTGRES_USER: ulrex
      POSTGRES_PASSWORD: ulrex_dev
    ports:
      - "5432:5432"
    volumes:
      - ulrex_postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulrex -d ulrex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ulrex_postgres_data:
